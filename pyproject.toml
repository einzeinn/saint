[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "saint"
version = "0.1.0"
description = "A context-aware path from user goals to understanding and action."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "loguru>=0.7,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "python-dotenv>=1.0,<2.0",
    "rich>=13.9,<15.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
agent-context = [
    "datahub-agent-context>=1.6,<2.0",
]

[project.scripts]
saint = "backend.app.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]

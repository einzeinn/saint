[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saint-datahub"
version = "0.1.0"
description = "A context-aware AI agent that turns data goals into investigation paths, powered by DataHub."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [
    { name = "M Rifki Haipal", email = "quiiplle@gmail.com" }
]
keywords = [
    "datahub", "agent", "context", "data", "cli",
    "metadata", "investigation", "ai", "llm"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "loguru>=0.7,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "python-dotenv>=1.0,<2.0",
    "rich>=13.9,<15.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
agent-context = [
    "datahub-agent-context>=1.6,<2.0",
]

[project.urls]
Homepage = "https://github.com/einzeinn/saint"
Repository = "https://github.com/einzeinn/saint"
"Bug Tracker" = "https://github.com/einzeinn/saint/issues"
Documentation = "https://github.com/einzeinn/saint/blob/main/docs/JudgeSetup.md"

[project.scripts]
saint = "backend.app.cli:main"

[tool.setuptools.packages.find]
include = ["backend*", "skills*"]

[project.entry-points."datahub_agent_context.skills"]
saint_investigator = "skills.saint_investigator:SaintInvestigatorSkill"
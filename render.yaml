services:
  - type: web
    name: saint-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATAHUB_PROVIDER
        value: mcp
      - key: DATAHUB_MCP_URL
        sync: false
      - key: DATAHUB_TOKEN
        sync: false
      - key: DATAHUB_MCP_TIMEOUT_SECONDS
        value: "20"
      - key: DATAHUB_MCP_SEARCH_TOOL
        value: search
      - key: DATAHUB_MCP_ENTITY_TOOL
        value: get_entities
